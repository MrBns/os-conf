# ---------------------------------------------------------------------------
# Server prompt (OC_MODE=server).
#
# No nerd-font glyphs, no powerline separators, no background colours - this
# has to render in a bare TTY, inside tmux and through whatever ssh client is
# at hand. Colours are the terminal's own 16, so it stays readable whatever
# theme the client uses.
#
# user@host is always shown: a server shell should never look like a local one,
# and root turns bold red so you notice before you type something regrettable.
#
# Only the modules listed in `format` are ever evaluated, so the prompt stays
# fast - no language/runtime probing on every command.
# ---------------------------------------------------------------------------

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$status\
$character"""

add_newline = false
command_timeout = 1000

[username]
show_always = true
style_user = "bold cyan"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold yellow"
format = "[@$hostname]($style) "

[directory]
style = "bold blue"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 4
truncation_symbol = ".../"
read_only = " ro"
read_only_style = "bold red"

[git_branch]
symbol = ""
style = "bold purple"
format = "[$branch]($style) "

[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 2000
style = "yellow"
format = "[+$duration]($style) "

# Exit code of the last command - worth seeing on a box you are debugging.
[status]
disabled = false
style = "bold red"
format = "[$status]($style) "

[character]
success_symbol = "[\\$](bold green)"
error_symbol = "[\\$](bold red)"
vicmd_symbol = "[<](bold yellow)"
